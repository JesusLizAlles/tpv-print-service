# Integración continua y versiones de TPV Print Service.
#
# - Cada push a main y cada pull request: tipos y tests (Linux), y en Windows tests, instalador y
#   prueba completa (instala el servicio, HTTPS e impresión real por la cola de Windows).
# - Al subir una etiqueta vX.Y.Z (que debe coincidir con "version" de package.json): además deja el
#   instalador y SHA256SUMS.txt en una Release en borrador. Al publicarla, los agentes instalados
#   la detectan y se actualizan solos (src/updater.ts).
# - "Run workflow" a mano: lo mismo sin Release (el instalador queda como artefacto 7 días).
#
# Las acciones van fijadas por commit (con la versión en el comentario) para que una etiqueta
# movida no cambie el código que se ejecuta con acceso al repositorio.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Un push nuevo cancela la ejecución anterior de la misma rama; las versiones nunca se cancelan.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  windows:
    name: Instalador y prueba en Windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

      - name: La etiqueta coincide con package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::La etiqueta $GITHUB_REF_NAME no coincide con la versión de package.json ($version)"
            exit 1
          fi

      - name: Inno Setup
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          if (-not (Test-Path $iscc)) { throw 'No se encuentra ISCC.exe' }
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Generar el instalador
        run: npm run dist:win

      - name: Prueba completa (instalar, HTTPS, imprimir, desinstalar)
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist\tpv-print-service-*-setup.exe | Select-Object -First 1
          ./scripts/e2e-windows.ps1 -Installer $exe.FullName

      - name: Registros del agente
        if: failure()
        shell: pwsh
        run: Get-ChildItem "$env:ProgramData\TPVPrint\logs" -ErrorAction SilentlyContinue | ForEach-Object { "--- $($_.Name)"; Get-Content $_.FullName -Encoding UTF8 }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          name: instalador-windows
          path: dist/tpv-print-service-*-setup.exe
          retention-days: 7
          if-no-files-found: error

  release:
    name: Release en borrador
    needs: [test, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: instalador-windows
          path: paquetes

      # El agente descarga este fichero y comprueba la suma antes de instalar.
      - name: Sumas SHA-256
        working-directory: paquetes
        run: sha256sum * | tee SHA256SUMS.txt

      # En borrador: se revisa y se publica a mano desde la página de Releases.
      - name: Crear la Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" paquetes/*
          --repo "$GITHUB_REPOSITORY"
          --title "TPV Print Service $GITHUB_REF_NAME"
          --generate-notes
          --draft
